<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro de Competencia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cronómetro de Competencia</h1>
        
        <div class="display" id="display">00:00:00.00</div>

        <div class="controls">
            <button id="btnStart" onclick="start()">Iniciar</button>
            <button id="btnPause" onclick="pause()" disabled>Pausar</button>
            <button id="btnCapture" onclick="capture()" disabled>Capturar</button>
            <button id="btnReset" onclick="reset()">Reiniciar</button>
        </div>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tiempo Capturado</th>
                    <th>Diferencia (vs 1ro)</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
